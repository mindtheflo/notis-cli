name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        working-directory: packages/cli
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: packages/cli
        run: npm test
      - name: Fresh-package smoke
        working-directory: packages/cli
        run: npm run smoke
